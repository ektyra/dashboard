name: Deploy
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  deploy:
    # Fork PRs and Dependabot PRs have no access to secrets.
    if: github.event_name == 'push' || (github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]')
    runs-on: ubuntu-latest
    environment: ${{ github.event_name == 'push' && 'production' || 'preview' }}
    permissions:
      contents: read
      pull-requests: write
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: voidzero-dev/setup-vp@v1
        with:
          cache: true
      - run: vp install --frozen-lockfile
      - run: vp run @ektyra/dashboard#build

      - name: Deploy (production)
        if: github.event_name == 'push'
        working-directory: apps/dashboard
        run: vp exec wrangler deploy

      - name: Upload version (preview)
        if: github.event_name == 'pull_request'
        id: preview
        working-directory: apps/dashboard
        run: |
          vp exec wrangler versions upload --tag "pr-${{ github.event.number }}" --message "PR #${{ github.event.number }}" | tee out.txt
          echo "url=$(grep -oE 'https://[^ ]+workers\.dev' out.txt | head -1)" >> "$GITHUB_OUTPUT"

      - name: Comment preview URL
        if: github.event_name == 'pull_request' && steps.preview.outputs.url != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr comment ${{ github.event.number }} --body "Preview version uploaded: ${{ steps.preview.outputs.url }}"
