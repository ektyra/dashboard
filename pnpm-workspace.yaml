packages:
  - apps/*
  - packages/*

catalogMode: prefer

catalog:
  "@types/node": ^24
  "@types/react": ^19.2.0
  "@types/react-dom": ^19.2.0
  "@vitejs/plugin-react": ^6.0.1
  "@tailwindcss/vite": ^4.1.18
  "@tanstack/react-router": 1.170.46
  "@tanstack/react-start": 1.169.7
  "@tanstack/react-router-devtools": 1.167.4
  "@tanstack/react-devtools": 0.10.15
  "@tanstack/devtools-vite": 0.8.7
  react: ^19.2.0
  react-dom: ^19.2.0
  tailwindcss: ^4.1.18
  typescript: ^7.0.2
  vite: npm:@voidzero-dev/vite-plus-core@1.6.0
  vite-plus: 1.6.0
  "@commitlint/cli": ^21.2.4
  "@commitlint/config-conventional": ^21.2.4
  "@storybook/react-vite": ^10.6.8
  "@cloudflare/vite-plugin": ^1.70.1
  wrangler: ^4.167.0
overrides:
  vite@*: "catalog:"
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"
allowBuilds:
  esbuild: true
  lightningcss: true
